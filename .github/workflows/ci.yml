name: ✅ CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'f1_agent/**'
      - 'db/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: tests unitarios + integración contra Postgres 17 ──────────────
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: f1
          POSTGRES_PASSWORD: f1
          POSTGRES_DB: f1hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U f1 -d f1hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: npm ci
        working-directory: server
        run: npm ci
      - name: Schema de db/init carga en Postgres 17 limpio
        env:
          PGPASSWORD: f1
        run: psql -h localhost -U f1 -d f1hub -v ON_ERROR_STOP=1 -q -f db/init/01_schema.sql
      - name: Tests (unit + integración)
        working-directory: server
        env:
          # Los tests de integración crean y borran su propio schema aislado.
          TEST_DATABASE_URL: postgres://f1:f1@localhost:5432/f1hub
        run: npm test

  # ── Agente Python ──────────────────────────────────────────────────────────
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: f1_agent/requirements-sync.txt
      - run: pip install -r f1_agent/requirements-sync.txt
      - name: Tests del sync
        working-directory: f1_agent
        run: python -m unittest -v test_sync_results

  # ── Imágenes Docker: build + smoke del backend en modo producción ──────────
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build backend (target prod)
        run: docker build --target prod -t f1-api:ci ./server
      - name: Build agente
        run: docker build -t f1-agent:ci ./f1_agent
      - name: La imagen prod no incluye tests ni fixtures
        run: |
          if docker run --rm f1-api:ci sh -c 'find /app/src -name "*.test.js" -o -name "__fixtures__" | grep -q .'; then
            echo "::error::La imagen prod contiene tests o fixtures"; exit 1
          fi
      - name: Smoke /api/health
        run: |
          docker run -d --name api -p 3000:3000 \
            -e NODE_ENV=production -e JWT_SECRET=ci -e PORT=3000 -e RESEND_API_KEY=re_ci \
            -e DATABASE_URL=postgres://nobody:nobody@127.0.0.1:1/none \
            -e CLOUDFLARE_R2_BUCKET=ci -e CLOUDFLARE_R2_PUBLIC_URL=https://ci.invalid \
            -e CLOUDFLARE_ACCOUNT_ID=ci -e CLOUDFLARE_R2_ACCESS_KEY=ci -e CLOUDFLARE_R2_SECRET_KEY=ci \
            f1-api:ci
          for i in $(seq 1 20); do
            if curl -fsS localhost:3000/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api; exit 1
